services:
  - type: web
    name: vj-join-request-acceptor-bot
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT & python3 bot.py
    autoDeploy: true
    healthCheckPath: /
